<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Upper and lower airway</title>
  <desc id="d">Side view of the airway. Upper airway structures in navy: nasal cavity, oral cavity, nasopharynx, oropharynx, laryngopharynx, epiglottis, larynx. Lower airway structures in blue: trachea, carina, right and left mainstem bronchi, bronchioles, alveoli. A dashed line at the larynx marks the boundary.</desc>
  <style>
    .up { stroke: #0F1F3D; }
    .lo { stroke: #2E7DFF; }
    .lbl { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #0F1F3D; }
    .lbl.lo-t { fill: #2E7DFF; }
    .hd { font-family: Oswald, Impact, 'Arial Narrow', sans-serif; font-size: 20px; letter-spacing: 1px; }
    .lead { stroke: #8A94A6; stroke-width: 1; }
  </style>
  <rect width="640" height="720" fill="#FFFFFF"/>

  <!-- Head profile, simplified -->
  <path class="up" d="M300 60 C 240 60, 200 110, 200 170 C 200 210, 215 235, 240 250 L 250 300 L 300 300" fill="none" stroke-width="3"/>
  <path class="up" d="M240 250 C 260 245, 285 240, 300 250" fill="none" stroke-width="3"/>

  <!-- Nasal cavity and nasopharynx -->
  <path class="up" d="M225 175 C 250 165, 290 170, 320 185" fill="none" stroke-width="4"/>
  <path class="up" d="M320 185 C 335 195, 340 215, 340 235" fill="none" stroke-width="4"/>
  <!-- Oral cavity and oropharynx -->
  <path class="up" d="M245 245 C 275 240, 310 245, 340 255" fill="none" stroke-width="4"/>
  <!-- Pharynx down to larynx -->
  <path class="up" d="M340 235 L 340 330" fill="none" stroke-width="4"/>
  <!-- Epiglottis flap -->
  <path class="up" d="M340 300 C 325 292, 318 285, 315 275" fill="none" stroke-width="4" stroke-linecap="round"/>
  <!-- Larynx box -->
  <rect class="up" x="326" y="330" width="28" height="36" rx="4" fill="none" stroke-width="4"/>
  <line class="up" x1="333" y1="340" x2="347" y2="356" stroke-width="2"/>
  <line class="up" x1="347" y1="340" x2="333" y2="356" stroke-width="2"/>
  <!-- Cricoid ring -->
  <ellipse class="up" cx="340" cy="372" rx="17" ry="6" fill="none" stroke-width="4"/>

  <!-- Boundary -->
  <line x1="120" y1="386" x2="560" y2="386" stroke="#8A94A6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="120" y="378" class="hd" fill="#0F1F3D">UPPER AIRWAY</text>
  <text x="120" y="412" class="hd" fill="#2E7DFF">LOWER AIRWAY</text>

  <!-- Trachea -->
  <path class="lo" d="M340 386 L 340 470" fill="none" stroke-width="6"/>
  <g class="lo" stroke-width="2" fill="none">
    <path d="M330 400 C 335 397, 345 397, 350 400"/>
    <path d="M330 416 C 335 413, 345 413, 350 416"/>
    <path d="M330 432 C 335 429, 345 429, 350 432"/>
    <path d="M330 448 C 335 445, 345 445, 350 448"/>
  </g>
  <!-- Carina and mainstem bronchi -->
  <path class="lo" d="M340 470 L 290 530" fill="none" stroke-width="5"/>
  <path class="lo" d="M340 470 L 400 525" fill="none" stroke-width="5"/>
  <!-- Bronchioles -->
  <g class="lo" fill="none" stroke-width="3">
    <path d="M290 530 L 255 575"/>
    <path d="M290 530 L 300 585"/>
    <path d="M255 575 L 235 605"/>
    <path d="M255 575 L 265 610"/>
    <path d="M300 585 L 285 620"/>
    <path d="M300 585 L 318 618"/>
    <path d="M400 525 L 430 575"/>
    <path d="M400 525 L 395 585"/>
    <path d="M430 575 L 455 605"/>
    <path d="M430 575 L 425 612"/>
    <path d="M395 585 L 375 618"/>
    <path d="M395 585 L 405 622"/>
  </g>
  <!-- Alveoli clusters -->
  <g class="lo" fill="none" stroke-width="2.5">
    <circle cx="232" cy="614" r="8"/><circle cx="244" cy="622" r="7"/><circle cx="226" cy="628" r="6"/>
    <circle cx="268" cy="620" r="8"/><circle cx="278" cy="630" r="6"/>
    <circle cx="283" cy="630" r="7"/><circle cx="292" cy="640" r="6"/>
    <circle cx="322" cy="628" r="8"/><circle cx="332" cy="636" r="6"/>
    <circle cx="458" cy="614" r="8"/><circle cx="468" cy="624" r="6"/>
    <circle cx="428" cy="622" r="8"/><circle cx="420" cy="632" r="6"/>
    <circle cx="372" cy="628" r="8"/><circle cx="364" cy="638" r="6"/>
    <circle cx="410" cy="632" r="8"/><circle cx="418" cy="642" r="6"/>
  </g>

  <!-- Labels: upper -->
  <line class="lead" x1="255" y1="170" x2="150" y2="150"/>
  <text x="30" y="154" class="lbl">Nasal cavity</text>
  <line class="lead" x1="338" y1="215" x2="450" y2="200"/>
  <text x="455" y="204" class="lbl">Nasopharynx</text>
  <line class="lead" x1="290" y1="245" x2="150" y2="235"/>
  <text x="30" y="239" class="lbl">Oral cavity</text>
  <line class="lead" x1="343" y1="262" x2="450" y2="252"/>
  <text x="455" y="256" class="lbl">Oropharynx</text>
  <line class="lead" x1="318" y1="280" x2="150" y2="290"/>
  <text x="30" y="294" class="lbl">Epiglottis</text>
  <line class="lead" x1="343" y1="318" x2="450" y2="306"/>
  <text x="455" y="310" class="lbl">Laryngopharynx</text>
  <line class="lead" x1="326" y1="348" x2="150" y2="340"/>
  <text x="30" y="344" class="lbl">Larynx and vocal cords</text>
  <line class="lead" x1="357" y1="372" x2="450" y2="360"/>
  <text x="455" y="364" class="lbl">Cricoid ring</text>

  <!-- Labels: lower -->
  <line class="lead" x1="346" y1="430" x2="450" y2="440"/>
  <text x="455" y="444" class="lbl lo-t">Trachea</text>
  <line class="lead" x1="342" y1="472" x2="150" y2="470"/>
  <text x="30" y="474" class="lbl lo-t">Carina</text>
  <line class="lead" x1="372" y1="500" x2="450" y2="500"/>
  <text x="455" y="504" class="lbl lo-t">Mainstem bronchi</text>
  <line class="lead" x1="268" y1="560" x2="150" y2="560"/>
  <text x="30" y="564" class="lbl lo-t">Bronchioles</text>
  <line class="lead" x1="235" y1="640" x2="150" y2="660"/>
  <text x="30" y="664" class="lbl lo-t">Alveoli</text>
  <text x="30" y="684" class="lbl" fill="#8A94A6" font-size="13">(gas exchange happens only here)</text>

  <!-- Footer -->
  <text x="30" y="708" class="lbl" fill="#8A94A6" font-size="12">Ladder One Academy · Rung 1 · EMT · Module 2 — Airway · EMT-02-01-01</text>
</svg>
