<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620" role="img" aria-labelledby="t d">
  <title id="t">Telling four respiratory emergencies apart</title>
  <desc id="d">Chart for a short-of-breath patient, branching on what is heard. Wheeze on exhalation: ASTHMA (episodic, reversible; silent chest is worse not better), and below it COPD (smoking history, barrel chest, pursed lips; compare to their baseline; do not withhold oxygen). Crackles worst at the bases: PULMONARY EDEMA, a heart problem not a lung one (cannot lie flat, pink frothy sputum, distended neck veins, swollen ankles; CPAP per protocol). Quiet on one side: PNEUMOTHORAX (sudden, sharp, one-sided; tall, thin, young; no trauma), with a dashed GETTING WORSE box below — falling blood pressure, neck veins up, trachea pushed away — meaning tension, ALS now. A dashed CHEST SOUNDS CLEAR box: sudden onset, sharp on inspiration, fast heart rate, risk factors: PULMONARY EMBOLISM.</desc>
  <style>
    .box  { fill: #FFFFFF; stroke: #0F1F3D; stroke-width: 2.5; }
    .box-d{ fill: #FFFFFF; stroke: #2E7DFF; stroke-width: 2.5; stroke-dasharray: 8 5; }
    .warn { fill: #FFFFFF; stroke: #0F1F3D; stroke-width: 2.5; stroke-dasharray: 3 3; }
    .ttl  { font-family: Oswald, Impact, 'Arial Narrow', sans-serif; font-size: 18px; letter-spacing: 1px; fill: #0F1F3D; }
    .hd   { font-family: Oswald, Impact, 'Arial Narrow', sans-serif; font-size: 21px; letter-spacing: 1px; fill: #0F1F3D; }
    .lbl  { font-family: Inter, Arial, sans-serif; font-size: 13px; fill: #0F1F3D; }
    .sub  { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #8A94A6; }
    .act  { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #2E7DFF; }
    .arr  { stroke: #0F1F3D; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1F3D"/>
    </marker>
  </defs>
  <rect width="860" height="620" fill="#FFFFFF"/>

  <text class="hd" x="30" y="38">SHORT OF BREATH — WHAT DO YOU HEAR?</text>
  <text class="sub" x="30" y="58">Listen at the same level on both sides. The sound narrows it down; the history decides it.</text>

  <!-- start -->
  <rect class="box" x="330" y="76" width="200" height="46" rx="6"/>
  <text class="ttl" x="430" y="105" text-anchor="middle">LISTEN TO THE CHEST</text>

  <!-- three branches -->
  <path class="arr" d="M380 122 L 150 166" marker-end="url(#a2)"/>
  <path class="arr" d="M430 122 L 430 166" marker-end="url(#a2)"/>
  <path class="arr" d="M480 122 L 712 166" marker-end="url(#a2)"/>

  <text class="lbl" x="150" y="160" text-anchor="middle">wheeze on exhalation</text>
  <text class="lbl" x="430" y="160" text-anchor="middle">crackles, worst at the bases</text>
  <text class="lbl" x="712" y="160" text-anchor="middle">quiet on ONE side</text>

  <!-- asthma -->
  <rect class="box" x="30" y="176" width="240" height="140" rx="6"/>
  <text class="ttl" x="46" y="202">ASTHMA</text>
  <text class="lbl" x="46" y="226">Episodic, known trigger</text>
  <text class="lbl" x="46" y="246">Younger, reversible</text>
  <text class="lbl" x="46" y="266">Silent chest = worse, not better</text>
  <text class="act" x="46" y="296">Oxygen · calm · their own inhaler</text>

  <!-- copd -->
  <rect class="box" x="30" y="332" width="240" height="140" rx="6"/>
  <text class="ttl" x="46" y="358">COPD</text>
  <text class="lbl" x="46" y="382">Long smoking history</text>
  <text class="lbl" x="46" y="402">Barrel chest, pursed lips</text>
  <text class="lbl" x="46" y="422">Compare to THEIR baseline</text>
  <text class="act" x="46" y="452">Oxygen — do not withhold it</text>

  <path class="arr" d="M150 316 L 150 332" marker-end="url(#a2)"/>
  <text class="sub" x="158" y="328">chronic, not episodic</text>

  <!-- pulmonary edema -->
  <rect class="box-d" x="310" y="176" width="240" height="200" rx="6"/>
  <text class="ttl" x="326" y="202">PULMONARY EDEMA</text>
  <text class="sub" x="326" y="220">a heart problem, not a lung one</text>
  <text class="lbl" x="326" y="246">Cannot lie flat — pillows, chair</text>
  <text class="lbl" x="326" y="266">Pink frothy sputum when severe</text>
  <text class="lbl" x="326" y="286">Distended neck veins</text>
  <text class="lbl" x="326" y="306">Swollen ankles</text>
  <text class="act" x="326" y="340">CPAP, per protocol</text>

  <!-- pneumothorax -->
  <rect class="box" x="590" y="176" width="240" height="160" rx="6"/>
  <text class="ttl" x="606" y="202">PNEUMOTHORAX</text>
  <text class="lbl" x="606" y="226">Sudden, sharp, one-sided</text>
  <text class="lbl" x="606" y="246">Classically tall, thin, young</text>
  <text class="lbl" x="606" y="266">Spontaneous = no trauma</text>
  <text class="act" x="606" y="300">Oxygen · position · transport</text>

  <path class="arr" d="M710 336 L 710 366" marker-end="url(#a2)"/>
  <rect class="warn" x="590" y="376" width="240" height="118" rx="6"/>
  <text class="ttl" x="606" y="402">GETTING WORSE?</text>
  <text class="lbl" x="606" y="426">Falling blood pressure</text>
  <text class="lbl" x="606" y="446">Neck veins up, trachea pushed away</text>
  <text class="act" x="606" y="474">TENSION — ALS now, move</text>

  <!-- the one that hears normal -->
  <rect class="warn" x="310" y="412" width="240" height="118" rx="6"/>
  <text class="ttl" x="326" y="438">CHEST SOUNDS CLEAR?</text>
  <text class="lbl" x="326" y="462">Sudden onset, sharp on inspiration</text>
  <text class="lbl" x="326" y="482">Fast heart rate, risk factors</text>
  <text class="act" x="326" y="510">Think PULMONARY EMBOLISM</text>
  <path class="arr" d="M430 376 L 430 412" marker-end="url(#a2)"/>

  <text class="sub" x="30" y="560">Solid outline: what you hear points to it. Dashed outline: what you hear may be normal — the history carries the diagnosis.</text>
  <text class="sub" x="30" y="580">Nothing here is a substitute for a full assessment. Every box assumes you have already checked airway, breathing and circulation.</text>
  <text class="sub" x="30" y="600">Ladder One Academy · EMT Module 2 · unverified draft content</text>
</svg>
