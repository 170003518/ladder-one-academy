<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-labelledby="l1a-title l1a-desc">
  <title id="l1a-title">Ladder One Academy</title>
  <desc id="l1a-desc">A navy shield holding a three-rung ladder whose rails converge toward the top so the enclosed space reads as the letter A. The rungs are colored bottom to top: star white for EMT, ember for Fire, line blue for Paramedic. A six-point Star of Life sits above the ladder.</desc>

  <!-- Shield. Navy fill with a light outline so the mark holds on both a navy
       app background and white paper. -->
  <path id="shield"
        d="M100 6 L188 30 V132 C188 186 148 218 100 234 C52 218 12 186 12 132 V30 Z"
        fill="#0F1F3D" stroke="#F5F7FA" stroke-width="3" stroke-linejoin="round"/>
  <path id="shield-rule"
        d="M100 17 L178 38 V131 C178 179 143 207 100 222 C57 207 22 179 22 131 V38 Z"
        fill="none" stroke="#F5F7FA" stroke-width="1.25" stroke-opacity="0.35" stroke-linejoin="round"/>

  <!-- Star of Life: six straight bars with flat square ends, crossing at the
       center. Three rects at 0, 60 and 120 degrees make the six spokes. -->
  <g id="star-of-life" fill="#F5F7FA">
    <rect x="93.5" y="37" width="13" height="50"/>
    <rect x="93.5" y="37" width="13" height="50" transform="rotate(60 100 62)"/>
    <rect x="93.5" y="37" width="13" height="50" transform="rotate(120 100 62)"/>
  </g>

  <!-- Ladder. Rungs are drawn first so the rails cap their ends cleanly.
       Rails are 13 units wide, running from a 5-unit gap at the top out to a
       65-unit gap at the bottom; the triangle of negative space they enclose
       above the top rung is the A. -->
  <g id="ladder">
    <rect id="rung-3" data-tier="medic" x="85.44" y="106.5" width="29.11" height="11" rx="2" fill="#2E7DFF"/>
    <rect id="rung-2" data-tier="fire"  x="75.44" y="142.5" width="49.11" height="11" rx="2" fill="#F25C19"/>
    <rect id="rung-1" data-tier="emt"   x="65.44" y="178.5" width="69.11" height="11" rx="2" fill="#F5F7FA"/>

    <polygon id="rail-left"  points="84.5,92 97.5,92 67.5,200 54.5,200"    fill="#DCE3EC"/>
    <polygon id="rail-right" points="115.5,92 102.5,92 132.5,200 145.5,200" fill="#DCE3EC"/>
  </g>
</svg>
