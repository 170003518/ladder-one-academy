<!DOCTYPE html>
<html lang="en" data-text-size="base">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ladder One Academy</title>
<meta name="description" content="Climb to certified. EMT, Fire and Paramedic, one rung at a time.">
<link rel="icon" href="brand/logo.svg">
<link rel="stylesheet" href="brand/theme.css">
<link rel="stylesheet" href="brand/print.css">
<style>
  /* App shell layout. Colors and type come from brand/theme.css — nothing here
     hardcodes a hex value except the one translucent overlay. */
  .skip {
    position: absolute; left: -9999px;
    background: var(--signal-yellow); color: var(--navy);
    padding: var(--space-2) var(--space-4); border-radius: var(--radius); font-weight: 600;
  }
  .skip:focus { left: var(--space-4); top: var(--space-4); z-index: 10; }

  header.app, footer.app {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-5);
    border-bottom: 1px solid var(--border);
  }
  footer.app { border-bottom: 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  header.app .wordmark {
    font-family: var(--font-display); font-weight: 700;
    letter-spacing: var(--tracking-wider); text-transform: uppercase; font-size: var(--fs-sm);
  }
  header.app .spacer, footer.app .spacer { margin-left: auto; }

  main { display: block; max-width: 56rem; margin: 0 auto; padding: var(--space-6) var(--space-5) var(--space-10); }
  main:focus { outline: none; }
  .loading { color: var(--text-muted); }

  /* --- Hero --------------------------------------------------------------- */
  .hero { display: flex; gap: var(--space-6); align-items: center; flex-wrap: wrap; margin-bottom: var(--space-6); }
  .hero .mark { width: 120px; height: auto; flex: none; }
  .hero h1 { margin: 0; font-size: var(--fs-2xl); }
  .tagline { color: var(--text-muted); font-style: italic; margin: 0 0 var(--space-4); }

  .cta {
    display: inline-block; text-decoration: none;
    background: var(--ember); color: #fff;
    font-family: var(--font-display); font-size: var(--fs-md); font-weight: 600;
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    padding: var(--space-3) var(--space-5); border-radius: var(--radius);
    box-shadow: var(--shadow-1); transition: box-shadow var(--transition);
  }
  .cta:hover { box-shadow: var(--glow-unlocked); }
  .cta em {
    display: block; font-style: normal; font-family: var(--font-ui);
    font-size: var(--fs-xs); font-weight: 400; letter-spacing: 0; text-transform: none;
    opacity: .92; margin-top: 2px;
  }
  .cta--done { background: var(--surface-raised); color: var(--text-muted); }

  /* --- Banner ------------------------------------------------------------- */
  .banner {
    border-left: 3px solid var(--signal-yellow); background: var(--surface);
    padding: var(--space-3) var(--space-4); font-size: var(--fs-sm);
    color: var(--text-muted); margin-bottom: var(--space-6);
  }
  .banner--error { border-left-color: var(--ember); color: var(--text); }
  .banner code { font-size: var(--fs-xs); }

  /* --- Rungs -------------------------------------------------------------- */
  .rungs { display: flex; flex-direction: column; gap: var(--space-4); }

  .rung {
    position: relative; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: var(--space-4) var(--space-5) var(--space-4) var(--space-6);
    overflow: hidden;
  }
  .rung-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--tier-color); }
  .rung.is-locked { opacity: .82; }
  .rung.is-locked .rung-bar { background: var(--slate); }

  .rung header { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
  .rung h2 { margin: 0 0 var(--space-2); font-size: var(--fs-lg); }
  .rung .status {
    display: inline-flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--text-muted);
  }
  .lock { width: 1em; height: 1em; }

  .lock-why { display: flex; align-items: center; gap: var(--space-2); margin: 0 0 var(--space-2); color: var(--text); }
  .browse { margin: 0; font-size: var(--fs-sm); color: var(--text-muted); }

  .meta { margin: 0 0 var(--space-2); font-size: var(--fs-sm); color: var(--text-muted); }
  .bar { height: 6px; border-radius: var(--radius-pill); background: rgba(255,255,255,.08); overflow: hidden; margin-bottom: var(--space-3); }
  .bar span { display: block; height: 100%; background: var(--tier-color); }

  .modlist { list-style: none; margin: 0; padding: 0; font-size: var(--fs-sm); }
  .modlist li { padding: var(--space-2) 0; border-top: 1px solid var(--border); }
  .modlist em { display: block; font-style: normal; font-size: var(--fs-xs); color: var(--text-muted); }

  .attest { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border); }
  .attest label { display: flex; gap: var(--space-2); align-items: flex-start; font-size: var(--fs-sm); cursor: pointer; }
  .attest input { margin-top: .2em; flex: none; }
  .attest-on { margin: var(--space-2) 0 0; font-size: var(--fs-xs); color: var(--signal-yellow); }

  /* --- Lesson stub -------------------------------------------------------- */
  .stub .crumb { font-family: var(--font-display); letter-spacing: var(--tracking-wider); text-transform: uppercase; font-size: var(--fs-xs); color: var(--text-muted); margin-bottom: var(--space-2); }
  .stub h1 { margin-bottom: var(--space-2); }
  .verify-flag { color: var(--signal-yellow); font-size: var(--fs-sm); }
  .stub-box { border: 1px dashed var(--border); border-radius: var(--radius); padding: var(--space-5); margin: var(--space-5) 0; }
  .stub-box h2 { margin-bottom: var(--space-2); font-size: var(--fs-md); color: var(--text-muted); }
  .back { font-family: var(--font-display); letter-spacing: var(--tracking-wide); text-transform: uppercase; font-size: var(--fs-sm); }

  /* --- Lesson view -------------------------------------------------------- */
  .lesson .crumb { font-size: var(--fs-xs); color: var(--text-muted); margin-bottom: var(--space-3); }
  .lesson .crumb a { color: var(--text-muted); }
  .lesson .crumb span { opacity: .5; margin: 0 .25em; }

  .lesson-head h1 { margin-bottom: var(--space-2); }
  .lesson-meta {
    display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
    font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: var(--space-4);
  }
  .done-flag {
    font-family: var(--font-display); font-size: var(--fs-xs); text-transform: uppercase;
    letter-spacing: var(--tracking-wide); color: var(--line-blue);
  }

  .verify-banner {
    border-left: 3px solid var(--signal-yellow); background: var(--surface);
    padding: var(--space-3) var(--space-4); font-size: var(--fs-sm);
    color: var(--text-muted); margin-bottom: var(--space-5);
  }
  .verify-banner b { color: var(--signal-yellow); }
  .verify-banner__rule { display: block; margin-top: var(--space-2); font-size: var(--fs-xs); opacity: .85; }

  .tabs { display: flex; flex-wrap: wrap; gap: var(--space-1); border-bottom: 1px solid var(--border); margin-bottom: var(--space-5); }
  .tab {
    text-decoration: none; color: var(--text-muted);
    font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    padding: var(--space-3) var(--space-4); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab.is-active { color: var(--text); border-bottom-color: var(--tier-color); }

  .depth { display: flex; gap: var(--space-2); margin-bottom: var(--space-4); }
  .depth button, .confidence-btns button, .mode-foot button, .quiz-actions button {
    font: inherit; font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    background: var(--surface-raised); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: var(--space-2) var(--space-4); cursor: pointer;
  }
  .depth button[aria-pressed="true"] { background: var(--tier-color); color: var(--navy); border-color: var(--tier-color); }
  .depth-none { font-size: var(--fs-sm); color: var(--text-muted); font-style: italic; margin-bottom: var(--space-4); }

  .prose { font-size: var(--fs-md); line-height: var(--lh-loose); max-width: 38rem; }
  .analogy { font-size: var(--fs-lg); font-style: italic; color: var(--signal-yellow); max-width: 34rem; }
  .dispatch { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-muted); }

  .mode-foot { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin: var(--space-5) 0; }
  .mode-foot button:disabled { opacity: .55; cursor: default; }
  .mode-foot__hint { font-size: var(--fs-xs); color: var(--text-muted); }

  .keypoints {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--tier-color); border-radius: var(--radius);
    padding: var(--space-4) var(--space-5); margin: var(--space-5) 0;
  }
  .keypoints h2 { font-size: var(--fs-md); margin-bottom: var(--space-3); }
  .keypoints ul { margin: 0; padding-left: var(--space-5); }
  .keypoints li { margin-bottom: var(--space-2); }

  .concept-nav {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    border-top: 1px solid var(--border); padding-top: var(--space-4); margin-top: var(--space-6);
    font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
  }
  .concept-nav .is-off { color: var(--slate); opacity: .45; }
  .nav-pos { font-family: var(--font-ui); letter-spacing: 0; text-transform: none; color: var(--text-muted); }

  /* --- Quiz --------------------------------------------------------------- */
  .quiz-intro h2, .quiz-result h2 { font-size: var(--fs-lg); }
  .quiz-note { font-size: var(--fs-sm); color: var(--text-muted); max-width: 38rem; }
  .quiz-progress { font-size: var(--fs-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-wide); }
  .quiz-style { font-family: var(--font-mono); }
  .quiz-stem { font-size: var(--fs-md); line-height: var(--lh-snug); max-width: 38rem; margin-bottom: var(--space-4); }

  .opts { list-style: none; margin: 0 0 var(--space-5); padding: 0; max-width: 40rem; }
  .opt { margin-bottom: var(--space-2); }
  .opt > button {
    display: flex; gap: var(--space-3); width: 100%; text-align: left;
    font: inherit; color: var(--text); cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: var(--space-3) var(--space-4);
  }
  .opt > button:hover:not(:disabled) { border-color: var(--slate); }
  .opt > button:disabled { cursor: default; }
  .opt-letter { flex: none; color: var(--text-muted); font-weight: 600; }
  .opt.is-correct > button { border-color: var(--line-blue); box-shadow: inset 3px 0 0 var(--line-blue); }
  .opt.is-wrong   > button { border-color: var(--ember);     box-shadow: inset 3px 0 0 var(--ember); }
  .opt.is-dim     > button { opacity: .5; }
  .rationale { font-size: var(--fs-sm); color: var(--text-muted); margin: var(--space-2) 0 0 var(--space-6); max-width: 36rem; }
  .rationale b { color: var(--text); }

  .confidence { border-top: 1px solid var(--border); padding-top: var(--space-4); }
  .confidence > p { margin-bottom: var(--space-3); font-family: var(--font-display); text-transform: uppercase; letter-spacing: var(--tracking-wide); font-size: var(--fs-xs); color: var(--text-muted); }
  .confidence-btns { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
  .confidence-note { font-size: var(--fs-xs); color: var(--text-muted); margin: 0; }

  .quiz-result { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-5); }
  .quiz-result.is-pass { border-left: 3px solid var(--line-blue); }
  .quiz-result.is-fail { border-left: 3px solid var(--ember); }
  .score { font-size: var(--fs-lg); }
  .focus-note { font-size: var(--fs-sm); color: var(--text-muted); }
  .quiz-actions { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; margin-top: var(--space-4); }

  /* --- Do It mode --------------------------------------------------------- */
  .do-prompt { font-size: var(--fs-md); max-width: 38rem; margin-bottom: var(--space-5); }
  .do-list { list-style: none; margin: 0; padding: 0; max-width: 42rem; }
  .do-item {
    border: 1px solid var(--border); border-left: 3px solid var(--border);
    border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-3);
    background: var(--surface);
  }
  .do-item.is-right { border-left-color: var(--line-blue); }
  .do-item.is-wrong { border-left-color: var(--ember); }
  .do-stem { margin: 0 0 var(--space-3); }
  .do-num { color: var(--text-muted); margin-right: var(--space-2); }
  .do-choices { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .do-choice {
    font: inherit; font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    background: var(--surface-raised); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: var(--space-2) var(--space-4); cursor: pointer;
  }
  .do-choice:hover:not(:disabled) { border-color: var(--slate); }
  .do-choice:disabled { cursor: default; }
  .do-choice.is-correct { border-color: var(--line-blue); color: var(--line-blue); }
  .do-choice.is-wrong   { border-color: var(--ember);     color: var(--ember); }
  .do-choice.is-dim     { opacity: .45; }
  .do-why { font-size: var(--fs-sm); color: var(--text-muted); margin: var(--space-3) 0 0; }
  .do-why b { color: var(--text); }
  .do-foot { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; margin-top: var(--space-4); }
  .do-foot button {
    font: inherit; font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    background: var(--surface-raised); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: var(--space-2) var(--space-4); cursor: pointer;
  }
  .do-score { margin: 0; font-size: var(--fs-sm); color: var(--text-muted); }
  .do-solution {
    border: 1px solid var(--border); border-left: 3px solid var(--border);
    border-radius: var(--radius); padding: var(--space-4); margin-top: var(--space-4); max-width: 40rem;
  }
  .do-solution.is-right { border-left-color: var(--line-blue); }
  .do-solution.is-wrong { border-left-color: var(--ember); }
  .do-verdict { margin: 0 0 var(--space-2); }
  .do-worked { margin: 0; font-size: var(--fs-sm); color: var(--text-muted); }
  .do-note { font-size: var(--fs-xs); color: var(--text-muted); margin-top: var(--space-4); }

  /* --- Hear It ------------------------------------------------------------ */
  .hear-controls { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-3); }
  .hear-controls button {
    font: inherit; font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    background: var(--surface-raised); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: var(--space-2) var(--space-5); cursor: pointer; min-width: 6rem;
  }
  #hear-play { background: var(--ember); border-color: var(--ember); color: #fff; }
  .hear-rate {
    display: flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-muted);
  }
  .hear-rate input { width: 8rem; accent-color: var(--ember); }
  #hear-rate-label { color: var(--text); min-width: 2.8rem; }
  .hear-status { font-size: var(--fs-xs); color: var(--text-muted); }
  .hear-source { font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: var(--space-4); }
  .hear-text { font-size: var(--fs-md); line-height: var(--lh-loose); max-width: 38rem; }
  .hear-para {
    padding: var(--space-2) var(--space-3);
    border-left: 3px solid transparent; border-radius: var(--radius-sm);
    transition: background var(--transition), border-color var(--transition);
  }
  .hear-para.is-read { opacity: .5; }
  .hear-para.is-reading {
    background: var(--surface); border-left-color: var(--signal-yellow); opacity: 1;
  }

  /* --- Teach It Back ------------------------------------------------------ */
  .teach-prompt { font-size: var(--fs-md); max-width: 38rem; margin-bottom: var(--space-4); }
  .teach-input {
    display: block; width: 100%; max-width: 38rem;
    font: inherit; font-family: var(--font-ui); font-size: var(--fs-base);
    line-height: var(--lh-normal); color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: var(--space-3) var(--space-4); resize: vertical;
  }
  .teach-foot { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-4); }
  .teach-foot button {
    font: inherit; font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    background: var(--ember); color: #fff; border: 0; border-radius: var(--radius-pill);
    padding: var(--space-2) var(--space-5); cursor: pointer;
  }
  #teach-again { background: var(--surface-raised); color: var(--text); border: 1px solid var(--border); }
  .teach-yours, .teach-results, .teach-model {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: var(--space-4); margin-bottom: var(--space-4); max-width: 40rem;
  }
  .teach-results { border-left: 3px solid var(--tier-color); }
  .teach-model { border-left: 3px solid var(--line-blue); }
  .teach-yours h3, .teach-results h3, .teach-model h3 { font-size: var(--fs-md); margin-bottom: var(--space-3); }
  .teach-echo { white-space: pre-wrap; color: var(--text-muted); margin: 0; }
  .teach-points { list-style: none; margin: 0 0 var(--space-3); padding: 0; }
  .teach-points li { display: flex; gap: var(--space-3); margin-bottom: var(--space-2); }
  .teach-mark { flex: none; font-weight: 700; }
  .teach-points .is-hit .teach-mark { color: var(--line-blue); }
  .teach-points .is-miss .teach-mark { color: var(--ember); }
  .teach-points .is-miss { color: var(--text-muted); }
  .teach-accept { display: block; font-size: var(--fs-xs); font-style: italic; opacity: .8; }
  .teach-caveat { font-size: var(--fs-xs); color: var(--text-muted); margin: 0; }

  /* --- See It ------------------------------------------------------------- */
  .see-fig { margin: 0 0 var(--space-6); max-width: 40rem; }
  .see-open {
    display: block; width: 100%; padding: 0; cursor: zoom-in; position: relative;
    background: var(--star-white); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
  }
  .see-open img { display: block; width: 100%; height: auto; }
  .see-hint {
    position: absolute; right: var(--space-2); bottom: var(--space-2);
    background: rgba(15,31,61,.82); color: var(--star-white);
    font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    padding: var(--space-1) var(--space-3); border-radius: var(--radius-pill);
  }
  .see-fig figcaption { margin-top: var(--space-3); font-size: var(--fs-sm); }
  .see-credit { margin: var(--space-2) 0 0; font-size: var(--fs-xs); color: var(--text-muted); }

  .see-zoom {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8,19,40,.94);
    display: flex; flex-direction: column;
  }
  .see-zoom__bar {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
    padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--border);
    font-size: var(--fs-sm); color: var(--text-muted);
  }
  .see-zoom__bar button {
    font: inherit; font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    background: var(--surface-raised); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: var(--space-2) var(--space-4); cursor: pointer; flex: none;
  }
  .see-zoom__stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: var(--space-5); overflow: auto; background: var(--star-white);
  }
  .see-zoom__stage img { max-width: 100%; max-height: 100%; }

  /* --- Do It: sort into buckets ------------------------------------------- */
  .sort-how { font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: var(--space-3); }
  .sort-tray {
    display: flex; flex-wrap: wrap; gap: var(--space-2);
    padding: var(--space-3); margin-bottom: var(--space-5);
    border: 1px dashed var(--border); border-radius: var(--radius); min-height: 3.5rem;
  }
  .sort-item {
    font: inherit; font-size: var(--fs-sm); color: var(--text);
    background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: var(--radius-pill); padding: var(--space-2) var(--space-4); cursor: pointer;
  }
  .sort-item:hover:not(:disabled) { border-color: var(--slate); }
  .sort-item.is-selected { background: var(--signal-yellow); color: var(--navy); border-color: var(--signal-yellow); }
  .sort-item--placed { display: block; width: 100%; text-align: left; margin-bottom: var(--space-2); border-radius: var(--radius); }
  .sort-item--placed.is-right { border-color: var(--line-blue); box-shadow: inset 3px 0 0 var(--line-blue); }
  .sort-item--placed.is-wrong { border-color: var(--ember); box-shadow: inset 3px 0 0 var(--ember); }
  .sort-item--placed:disabled { cursor: default; }
  .sort-belongs { display: block; font-style: italic; font-size: var(--fs-xs); color: var(--ember); margin-top: 2px; }

  .sort-buckets { display: flex; gap: var(--space-4); flex-wrap: wrap; }
  .sort-bucket {
    flex: 1 1 14rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4);
  }
  .sort-bucket.is-target { border-color: var(--signal-yellow); border-style: dashed; }
  .sort-bucket h3 {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: var(--fs-md); margin-bottom: var(--space-3);
  }
  .sort-count { color: var(--text-muted); font-size: var(--fs-sm); }
  .sort-drop { min-height: 4rem; }
  .sort-empty { font-size: var(--fs-sm); color: var(--text-muted); font-style: italic; margin: 0; }
  #sort-check:disabled { opacity: .5; cursor: default; }

  /* --- Deck print --------------------------------------------------------- */
  .deck-opts { display: flex; gap: var(--space-5); flex-wrap: wrap; margin: var(--space-4) 0; }
  .deck-opts fieldset {
    flex: 1 1 18rem; border: 1px solid var(--border); border-radius: var(--radius);
    padding: var(--space-4); margin: 0;
  }
  .deck-opts legend {
    font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-muted);
    padding: 0 var(--space-2);
  }
  .deck-opts label { display: flex; gap: var(--space-2); align-items: baseline; margin-bottom: var(--space-2); font-size: var(--fs-sm); cursor: pointer; }
  .deck-opts label em { display: block; font-style: normal; font-size: var(--fs-xs); color: var(--text-muted); }
  .deck-opts select {
    font: inherit; font-size: var(--fs-sm); width: 100%;
    background: var(--surface-raised); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: var(--space-2) var(--space-3); margin: var(--space-1) 0 var(--space-3);
  }
  .deck-opts select:disabled { opacity: .45; }

  .deck-pick { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-4); }
  .deck-pick__bar { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; margin-bottom: var(--space-3); }
  .deck-pick__bar button {
    font: inherit; font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    background: var(--surface-raised); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: var(--space-2) var(--space-4); cursor: pointer;
  }
  .deck-list { list-style: none; margin: 0; padding: 0; max-height: 18rem; overflow-y: auto; }
  .deck-list label { display: flex; gap: var(--space-3); align-items: baseline; padding: var(--space-2) 0; border-top: 1px solid var(--border); font-size: var(--fs-sm); cursor: pointer; }
  .deck-list em { font-style: normal; font-size: var(--fs-xs); color: var(--text-muted); margin-left: auto; }
  .deck-list .num { color: var(--text-muted); }

  .deckprint .paper-stage .l1a-sheet { margin-bottom: var(--space-6); }
  .printview__actions button:disabled { opacity: .5; cursor: default; }

  /* --- Dev mode banner ---------------------------------------------------- */
  .devbanner {
    background: var(--signal-yellow); color: var(--navy);
    font-family: var(--font-display); font-size: var(--fs-xs); font-weight: 700;
    letter-spacing: var(--tracking-wider); text-transform: uppercase;
    text-align: center; padding: var(--space-2) var(--space-4);
    margin: 0 0 var(--space-5);
    border-radius: var(--radius-sm);
  }
  footer.app button[aria-pressed="true"] { background: var(--signal-yellow); color: var(--navy); border-color: var(--signal-yellow); }

  /* --- Module exam -------------------------------------------------------- */
  .exam-intro h2, .exam-review h2 { font-size: var(--fs-lg); }
  .weights-label { margin-bottom: var(--space-2); font-size: var(--fs-sm); color: var(--text-muted); }
  .weights { list-style: none; margin: 0 0 var(--space-4); padding: 0; display: flex; gap: var(--space-4); flex-wrap: wrap; font-size: var(--fs-sm); }
  .exam-locked {
    border-left: 3px solid var(--ember); background: var(--surface);
    padding: var(--space-4); margin: var(--space-4) 0;
  }
  .exam-locked b { color: var(--ember); }

  .exam-bar {
    display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3);
    font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    color: var(--text-muted); margin-bottom: var(--space-2);
  }
  .exam-clock { font-size: var(--fs-md); color: var(--text); }
  .exam-bar .ok { color: var(--line-blue); }
  .exam-bar .no { color: var(--ember); }
  .exam .bar { margin-bottom: var(--space-5); }

  .opt.is-picked > button { border-color: var(--signal-yellow); box-shadow: inset 3px 0 0 var(--signal-yellow); }
  .confidence.is-off { opacity: .55; }
  .confidence-btns button:disabled { cursor: default; opacity: .5; }

  .opts--review .opt { margin-bottom: var(--space-4); }
  .opt-static {
    display: flex; gap: var(--space-3);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: var(--space-3) var(--space-4);
  }
  .opt.is-correct .opt-static { border-color: var(--line-blue); box-shadow: inset 3px 0 0 var(--line-blue); }
  .opt.is-wrong   .opt-static { border-color: var(--ember);     box-shadow: inset 3px 0 0 var(--ember); }
  .opt-text em { color: var(--text-muted); font-style: italic; }
  .review-nav { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; margin-top: var(--space-5); }
  .review-nav button {
    font: inherit; font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    background: var(--surface-raised); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: var(--space-2) var(--space-4); cursor: pointer;
  }
  .review-nav button:disabled { opacity: .45; cursor: default; }

  table.domains, table.attempts { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); margin: var(--space-3) 0 var(--space-5); }
  table.domains th, table.domains td, table.attempts th, table.attempts td {
    text-align: left; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border);
  }
  table.domains th, table.attempts th {
    font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-muted);
  }
  .dbar { display: block; height: 6px; width: 100%; background: rgba(255,255,255,.08); border-radius: var(--radius-pill); overflow: hidden; }
  .dbar span { display: block; height: 100%; background: var(--tier-color); }

  .modlinks { display: block; margin-top: var(--space-1); }
  .modlinks a { font-size: var(--fs-xs); margin-right: var(--space-3); }

  /* --- Print view --------------------------------------------------------- */
  .printview__chrome { margin-bottom: var(--space-5); }
  .printview__actions { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; margin: var(--space-4) 0; }
  .printview__actions button {
    font: inherit; font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    background: var(--ember); color: #fff; border: 0; border-radius: var(--radius-pill);
    padding: var(--space-2) var(--space-5); cursor: pointer;
  }
  .paper-stage { background: #55607A; padding: var(--space-5); border-radius: var(--radius); overflow-x: auto; }
  .paper-stage .l1a-sheet { box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .stage-label {
    font-family: var(--font-display); letter-spacing: var(--tracking-wider);
    text-transform: uppercase; font-size: var(--fs-xs); color: var(--star-white);
    margin: 0 0 var(--space-3);
  }
  .paper-stage .stage-label + .l1a-sheet { margin-bottom: var(--space-5); }

  @media print {
    header.app, footer.app, .skip, .printview__chrome, .stage-label, .devbanner { display: none !important; }
    main { max-width: none; margin: 0; padding: 0; }
    .paper-stage { background: none !important; padding: 0; }
    .paper-stage .l1a-sheet { box-shadow: none !important; }
  }

  /* --- Footer controls ---------------------------------------------------- */
  footer.app button {
    font: inherit; font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    background: var(--surface-raised); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: var(--space-2) var(--space-4); cursor: pointer;
  }
  footer.app button:hover { border-color: var(--slate); }
  .say { font-size: var(--fs-sm); color: var(--signal-yellow); }
  .say--error { color: var(--ember); }
  footer.app small { font-size: var(--fs-xs); color: var(--text-muted); }
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="app">
  <img src="brand/logo.svg" alt="" width="24" height="29">
  <span class="wordmark">Ladder One Academy</span>
  <span class="spacer"></span>
  <small style="color:var(--text-muted);font-size:var(--fs-xs)">Shell v1</small>
</header>

<main id="main" tabindex="-1"><p class="loading">Loading…</p></main>

<footer class="app">
  <button type="button" id="export">Export progress</button>
  <button type="button" id="import">Import</button>
  <button type="button" id="reset">Clear</button>
  <button type="button" id="devmode" aria-pressed="false">Dev mode: off</button>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <span class="spacer"></span>
  <span id="say" class="say" role="status" aria-live="polite"></span>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
