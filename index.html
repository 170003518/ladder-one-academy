<!DOCTYPE html>
<html lang="en" data-text-size="base">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ladder One Academy</title>
<meta name="description" content="Climb to certified. EMT, Fire and Paramedic, one rung at a time.">
<link rel="icon" href="brand/logo.svg">
<link rel="stylesheet" href="brand/theme.css">
<link rel="stylesheet" href="brand/print.css">
<style>
  /* App shell layout. Colors and type come from brand/theme.css — nothing here
     hardcodes a hex value except the one translucent overlay. */
  .skip {
    position: absolute; left: -9999px;
    background: var(--signal-yellow); color: var(--navy);
    padding: var(--space-2) var(--space-4); border-radius: var(--radius); font-weight: 600;
  }
  .skip:focus { left: var(--space-4); top: var(--space-4); z-index: 10; }

  header.app, footer.app {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-5);
    border-bottom: 1px solid var(--border);
  }
  footer.app { border-bottom: 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  header.app .wordmark {
    font-family: var(--font-display); font-weight: 700;
    letter-spacing: var(--tracking-wider); text-transform: uppercase; font-size: var(--fs-sm);
  }
  header.app .spacer, footer.app .spacer { margin-left: auto; }

  main { display: block; max-width: 56rem; margin: 0 auto; padding: var(--space-6) var(--space-5) var(--space-10); }
  main:focus { outline: none; }
  .loading { color: var(--text-muted); }

  /* --- Hero --------------------------------------------------------------- */
  .hero { display: flex; gap: var(--space-6); align-items: center; flex-wrap: wrap; margin-bottom: var(--space-6); }
  .hero .mark { width: 120px; height: auto; flex: none; }
  .hero h1 { margin: 0; font-size: var(--fs-2xl); }
  .tagline { color: var(--text-muted); font-style: italic; margin: 0 0 var(--space-4); }

  .cta {
    display: inline-block; text-decoration: none;
    background: var(--ember); color: #fff;
    font-family: var(--font-display); font-size: var(--fs-md); font-weight: 600;
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    padding: var(--space-3) var(--space-5); border-radius: var(--radius);
    box-shadow: var(--shadow-1); transition: box-shadow var(--transition);
  }
  .cta:hover { box-shadow: var(--glow-unlocked); }
  .cta em {
    display: block; font-style: normal; font-family: var(--font-ui);
    font-size: var(--fs-xs); font-weight: 400; letter-spacing: 0; text-transform: none;
    opacity: .92; margin-top: 2px;
  }
  .cta--done { background: var(--surface-raised); color: var(--text-muted); }

  /* --- Banner ------------------------------------------------------------- */
  .banner {
    border-left: 3px solid var(--signal-yellow); background: var(--surface);
    padding: var(--space-3) var(--space-4); font-size: var(--fs-sm);
    color: var(--text-muted); margin-bottom: var(--space-6);
  }
  .banner--error { border-left-color: var(--ember); color: var(--text); }
  .banner code { font-size: var(--fs-xs); }

  /* --- Rungs -------------------------------------------------------------- */
  .rungs { display: flex; flex-direction: column; gap: var(--space-4); }

  .rung {
    position: relative; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: var(--space-4) var(--space-5) var(--space-4) var(--space-6);
    overflow: hidden;
  }
  .rung-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--tier-color); }
  .rung.is-locked { opacity: .82; }
  .rung.is-locked .rung-bar { background: var(--slate); }

  .rung header { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
  .rung h2 { margin: 0 0 var(--space-2); font-size: var(--fs-lg); }
  .rung .status {
    display: inline-flex; align-items: center; gap: var(--space-2);
    font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--text-muted);
  }
  .lock { width: 1em; height: 1em; }

  .lock-why { display: flex; align-items: center; gap: var(--space-2); margin: 0 0 var(--space-2); color: var(--text); }
  .browse { margin: 0; font-size: var(--fs-sm); color: var(--text-muted); }

  .meta { margin: 0 0 var(--space-2); font-size: var(--fs-sm); color: var(--text-muted); }
  .bar { height: 6px; border-radius: var(--radius-pill); background: rgba(255,255,255,.08); overflow: hidden; margin-bottom: var(--space-3); }
  .bar span { display: block; height: 100%; background: var(--tier-color); }

  .modlist { list-style: none; margin: 0; padding: 0; font-size: var(--fs-sm); }
  .modlist li { padding: var(--space-2) 0; border-top: 1px solid var(--border); }
  .modlist em { display: block; font-style: normal; font-size: var(--fs-xs); color: var(--text-muted); }

  .attest { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border); }
  .attest label { display: flex; gap: var(--space-2); align-items: flex-start; font-size: var(--fs-sm); cursor: pointer; }
  .attest input { margin-top: .2em; flex: none; }
  .attest-on { margin: var(--space-2) 0 0; font-size: var(--fs-xs); color: var(--signal-yellow); }

  /* --- Lesson stub -------------------------------------------------------- */
  .stub .crumb { font-family: var(--font-display); letter-spacing: var(--tracking-wider); text-transform: uppercase; font-size: var(--fs-xs); color: var(--text-muted); margin-bottom: var(--space-2); }
  .stub h1 { margin-bottom: var(--space-2); }
  .verify-flag { color: var(--signal-yellow); font-size: var(--fs-sm); }
  .stub-box { border: 1px dashed var(--border); border-radius: var(--radius); padding: var(--space-5); margin: var(--space-5) 0; }
  .stub-box h2 { margin-bottom: var(--space-2); font-size: var(--fs-md); color: var(--text-muted); }
  .back { font-family: var(--font-display); letter-spacing: var(--tracking-wide); text-transform: uppercase; font-size: var(--fs-sm); }

  /* --- Footer controls ---------------------------------------------------- */
  footer.app button {
    font: inherit; font-family: var(--font-display); font-size: var(--fs-xs);
    letter-spacing: var(--tracking-wide); text-transform: uppercase;
    background: var(--surface-raised); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: var(--space-2) var(--space-4); cursor: pointer;
  }
  footer.app button:hover { border-color: var(--slate); }
  .say { font-size: var(--fs-sm); color: var(--signal-yellow); }
  .say--error { color: var(--ember); }
  footer.app small { font-size: var(--fs-xs); color: var(--text-muted); }
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="app">
  <img src="brand/logo.svg" alt="" width="24" height="29">
  <span class="wordmark">Ladder One Academy</span>
  <span class="spacer"></span>
  <small style="color:var(--text-muted);font-size:var(--fs-xs)">Shell v1</small>
</header>

<main id="main" tabindex="-1"><p class="loading">Loading…</p></main>

<footer class="app">
  <button type="button" id="export">Export progress</button>
  <button type="button" id="import">Import</button>
  <button type="button" id="reset">Clear</button>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <span class="spacer"></span>
  <span id="say" class="say" role="status" aria-live="polite"></span>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
